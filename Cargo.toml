[package]
name = "tide-dlp"
version = "0.1.0"
edition = "2024"
description = "A resilient, approachable Ratatui frontend for yt-dlp"
license = "MIT"

[[bin]]
name = "tide"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6.0"
futures = "0.3"
ratatui = "0.30"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ratatui-image = { version = "11.0", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shell-words = "1.1"
tokio = { version = "1.47", features = ["full"] }
unicode-width = "0.2"
url = "2.5"
uuid = { version = "1.18", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
